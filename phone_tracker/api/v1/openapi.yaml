openapi: 3.0.3
info:
  title: ISATU Visitor Mobile API
  version: "1.0"
  description: Versioned API used only by the native visitor Android application.
servers:
  - url: /visitor-management-system/phone_tracker/api/v1
security:
  - bearerAuth: []
paths:
  /health.php:
    get:
      security: []
      summary: Check API and migration readiness
      responses:
        "200": { $ref: "#/components/responses/Success" }
  /auth/register.php:
    post:
      security: []
      summary: Register a visitor account
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterRequest" }
      responses:
        "201": { $ref: "#/components/responses/Success" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /auth/login.php:
    post:
      security: []
      summary: Sign in and issue a bearer token
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "401": { $ref: "#/components/responses/Error" }
        "403": { $ref: "#/components/responses/Error" }
  /auth/logout.php:
    post:
      summary: Revoke the current bearer token
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "401": { $ref: "#/components/responses/Error" }
  /auth/request_password_reset.php:
    post:
      security: []
      summary: Queue password reset instructions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "429": { $ref: "#/components/responses/Error" }
  /auth/reset_password.php:
    post:
      security: []
      summary: Consume a password reset token and revoke old sessions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, token, new_password]
              properties:
                email: { type: string, format: email }
                token: { type: string, minLength: 64, maxLength: 64 }
                new_password: { type: string, minLength: 10, maxLength: 128 }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "422": { $ref: "#/components/responses/Error" }
  /me.php:
    get:
      summary: Read the current visitor profile
      responses:
        "200": { $ref: "#/components/responses/Success" }
    patch:
      summary: Update visitor name and contact number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [full_name]
              properties:
                full_name: { type: string, maxLength: 100 }
                contact_number: { type: string, maxLength: 32 }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "422": { $ref: "#/components/responses/Error" }
  /offices.php:
    get:
      summary: List the five official offices and availability rules
      responses:
        "200": { $ref: "#/components/responses/Success" }
  /availability.php:
    get:
      summary: List bookable slots for one office and date
      parameters:
        - in: query
          name: office_code
          required: true
          schema: { $ref: "#/components/schemas/OfficeCode" }
        - in: query
          name: date
          required: true
          schema: { type: string, format: date }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "422": { $ref: "#/components/responses/Error" }
  /appointments.php:
    get:
      summary: List the current visitor's appointments
      parameters:
        - in: query
          name: status
          schema: { $ref: "#/components/schemas/AppointmentStatus" }
        - in: query
          name: before_id
          schema: { type: integer, minimum: 1 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 30 }
      responses:
        "200": { $ref: "#/components/responses/Success" }
    post:
      summary: Create a walk-in pass or submit an appointment request
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AppointmentRequest" }
      responses:
        "201": { $ref: "#/components/responses/Success" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /appointment.php:
    get:
      summary: Read appointment details, proposal, and eligible QR pass
      description: A stop of a multi-stop visit includes a VisitSummary in visit and no qr_pass; use visit.php for its pass.
      parameters:
        - in: query
          name: id
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "404": { $ref: "#/components/responses/Error" }
  /appointment_cancel.php:
    post:
      summary: Cancel an eligible visitor appointment
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [appointment_id]
              properties:
                appointment_id: { type: integer, minimum: 1 }
                reason: { type: string, maxLength: 500 }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "409": { $ref: "#/components/responses/Error" }
  /reschedule_response.php:
    post:
      summary: Accept or decline an Office schedule proposal
      description: >
        For a stop of a multi-stop visit, an accepted time must leave 10 minutes around the
        visit's other stops (409 otherwise). A time on a different day moves the stop out of
        the visit; the response then has left_visit true and the stop gets its own QR pass.
        A stop accepted while its visit is checked in becomes checked_in.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [proposal_id, action]
              properties:
                proposal_id: { type: integer, minimum: 1 }
                action: { type: string, enum: [accept, decline] }
                selected_slot_id: { type: integer, minimum: 1, nullable: true }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "409": { $ref: "#/components/responses/Error" }
  /visits.php:
    post:
      summary: Book a multi-stop visit (two or three offices on one day)
      description: >
        Every stop is checked against its office's availability, stops must be at least
        10 minutes apart, and they must not clash with the visitor's other bookings. All
        stops are created together or not at all. Each stop is an appointment that its own
        office approves; the visit has one QR pass covering every approved stop.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VisitRequest" }
      responses:
        "201": { $ref: "#/components/responses/Success" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /visit.php:
    get:
      summary: Read a multi-stop visit with its stops, pass, and tracking stop
      parameters:
        - in: query
          name: id
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "404": { $ref: "#/components/responses/Error" }
  /visit_cancel.php:
    post:
      summary: Cancel every stop of a visit that has not been checked in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [visit_id]
              properties:
                visit_id: { type: integer, minimum: 1 }
                reason: { type: string, maxLength: 500 }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /notifications.php:
    get:
      summary: List visitor notifications
      parameters:
        - in: query
          name: unread_only
          schema: { type: boolean, default: false }
        - in: query
          name: before_id
          schema: { type: integer, minimum: 1 }
        - in: query
          name: limit
          schema: { type: integer, minimum: 1, maximum: 100, default: 30 }
      responses:
        "200": { $ref: "#/components/responses/Success" }
  /notification_read.php:
    post:
      summary: Mark one or every notification read
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                notification_id: { type: integer, minimum: 1 }
                mark_all: { type: boolean }
      responses:
        "200": { $ref: "#/components/responses/Success" }
  /devices.php:
    post:
      summary: Register or rotate an Android FCM token
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeviceRegistration" }
      responses:
        "200": { $ref: "#/components/responses/Success" }
    delete:
      summary: Unregister an Android installation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [installation_id]
              properties:
                installation_id: { type: string, minLength: 8, maxLength: 191 }
      responses:
        "200": { $ref: "#/components/responses/Success" }
  /consent.php:
    get:
      summary: Read appointment location consent
      parameters:
        - in: query
          name: appointment_id
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200": { $ref: "#/components/responses/Success" }
    post:
      summary: Grant or withdraw appointment location consent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [appointment_id, action]
              properties:
                appointment_id: { type: integer, minimum: 1 }
                action: { type: string, enum: [grant, withdraw] }
                consent_version: { type: string, maxLength: 32 }
      responses:
        "200": { $ref: "#/components/responses/Success" }
  /tracking.php:
    get:
      summary: Read tracking eligibility, session, and server policy
      parameters:
        - in: query
          name: appointment_id
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200": { $ref: "#/components/responses/Success" }
    post:
      summary: Start or stop an appointment tracking session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [appointment_id, action]
              properties:
                appointment_id: { type: integer, minimum: 1 }
                action: { type: string, enum: [start, stop] }
                client_session_id: { type: string, maxLength: 64 }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "409": { $ref: "#/components/responses/Error" }
  /campus_map.php:
    get:
      summary: Campus map and walking guidance for one of the visitor's appointments
      description: >-
        Returns campus_configured, campus_updated_at, campus_boundary (latitude/longitude points), gates
        (name, latitude, longitude; also the named starts of recorded routes that no gate pin marks),
        destination and stops, exit_policy (minimum_accuracy_meters,
        outside_confirmation_points, outside_confirmation_seconds, boundary_buffer_meters),
        arrival_distance_meters and arrival_max_accuracy_meters (GPS must place the visitor within that
        distance of the office pin, from readings at least that accurate, to confirm an arrival;
        arrival_radius_meters repeats the distance for older app versions), and server_time.
        Each stop has appointment_id, office_code, label, location and description (from the Department
        Directory), latitude and longitude (the office pin; for an office with a recorded route but no
        pin, where its newest route ends; null when it has neither), location_source ("pin", "route",
        or null), status,
        visit_type, scheduled_start_at, scheduled_end_at, and arrived_at and arrival_method once the
        arrival is recorded. destination is the first stop still to visit, and null once every stop is
        done, when the app guides the visitor to a gate. walking_routes lists every walking route an
        administrator recorded (CAMPUS_ROUTES.md): id, office_code, name, start_label, distance_meters, and
        points as [latitude, longitude] pairs from the route's start (usually a gate) to the office; it is
        empty until campus_routes_migration.sql is imported. The app joins the routes into one walkway
        network and guides the visitor along it.
      parameters:
        - in: query
          name: appointment_id
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "404": { $ref: "#/components/responses/Error" }
  /arrival.php:
    post:
      summary: Record a confirmed arrival at one of the visitor's office stops
      description: >-
        method gps requires distance_meters within the arrival distance and accuracy_meters within
        arrival_max_accuracy_meters (campus_map.php); method visitor is the visitor tapping "I'm here".
        Only the first arrival per stop is kept (a repeat returns already_recorded true). The office's
        staff are notified and the activity log records it. 409 when the stop is not checked in.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [appointment_id, method]
              properties:
                appointment_id: { type: integer, minimum: 1, description: The office stop (for a multi-office visit, the stop's own appointment) }
                method: { type: string, enum: [gps, visitor] }
                distance_meters: { type: number, minimum: 0, nullable: true }
                accuracy_meters: { type: number, minimum: 0, nullable: true }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /locations.php:
    post:
      summary: Upload an idempotent GPS batch
      description: >-
        Positions outside the campus boundary are never stored; data.outside_campus counts them. After
        enough accurate readings outside (see campus_map.php exit_policy) the visit ends and data.visit_ended
        is true. Once a visit has ended, a batch with only later readings returns 409 so the app stops tracking.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tracking_session_id, points]
              properties:
                tracking_session_id: { type: integer, minimum: 1 }
                points:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items: { $ref: "#/components/schemas/LocationPoint" }
      responses:
        "200": { $ref: "#/components/responses/Success" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: OpaqueToken
  responses:
    Success:
      description: Successful API response
      content:
        application/json:
          schema: { $ref: "#/components/schemas/SuccessEnvelope" }
    Error:
      description: Error API response
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorEnvelope" }
  schemas:
    OfficeCode:
      type: string
      enum: [IT, IS, CS, DEANS, TECH_SUPPORT]
    AppointmentStatus:
      type: string
      enum: [pending_approval, approved, rejected, cancelled, unanswered, reschedule_proposed, checked_in, completed, window_closed]
    Meta:
      type: object
      required: [api_version, request_id]
      properties:
        api_version: { type: string, example: "1.0" }
        request_id: { type: string, example: a1b2c3d4e5f60708 }
    SuccessEnvelope:
      type: object
      required: [success, data, meta]
      properties:
        success: { type: boolean, enum: [true] }
        data: { type: object, additionalProperties: true }
        message: { type: string }
        meta: { $ref: "#/components/schemas/Meta" }
    ErrorEnvelope:
      type: object
      required: [success, message, meta]
      properties:
        success: { type: boolean, enum: [false] }
        message: { type: string }
        errors: { type: object, additionalProperties: true }
        meta: { $ref: "#/components/schemas/Meta" }
    RegisterRequest:
      type: object
      required: [email, full_name, password, tracking_consent, consent_version]
      properties:
        email: { type: string, format: email, maxLength: 190 }
        full_name: { type: string, minLength: 2, maxLength: 100 }
        contact_number: { type: string, maxLength: 32 }
        password: { type: string, minLength: 10, maxLength: 128 }
        tracking_consent: { type: boolean, enum: [true] }
        consent_version: { type: string, maxLength: 32 }
    LoginRequest:
      type: object
      required: [identifier, password]
      properties:
        identifier: { type: string, maxLength: 190 }
        password: { type: string, maxLength: 128 }
        installation_id: { type: string, maxLength: 191 }
        device_name: { type: string, maxLength: 100 }
    AppointmentRequest:
      type: object
      required: [visit_type, office_code, purpose, subject, location_consent]
      properties:
        visit_type: { type: string, enum: [appointment, walk_in] }
        office_code: { $ref: "#/components/schemas/OfficeCode" }
        purpose: { type: string, maxLength: 100 }
        subject: { type: string, maxLength: 150 }
        additional_details: { type: string, maxLength: 3000 }
        scheduled_start_at: { type: string, description: Required for appointments; ignored for walk-ins, example: "2026-09-21 09:00:00" }
        scheduled_end_at: { type: string, description: Optional slot end for appointments; ignored for walk-ins, example: "2026-09-21 09:30:00" }
        device_name: { type: string, maxLength: 100 }
        location_consent:
          type: object
          required: [granted, version]
          properties:
            granted: { type: boolean, enum: [true] }
            version: { type: string, maxLength: 32 }
    VisitStop:
      type: object
      required: [office_code, purpose, subject]
      properties:
        office_code: { $ref: "#/components/schemas/OfficeCode" }
        purpose: { type: string, maxLength: 100 }
        subject: { type: string, maxLength: 150 }
        additional_details: { type: string, maxLength: 3000 }
        scheduled_start_at: { type: string, description: Required for appointment visits; ignored for walk-ins, example: "2026-10-02 09:00:00" }
        scheduled_end_at: { type: string, description: Optional; defaults to the office slot length, example: "2026-10-02 09:30:00" }
    VisitRequest:
      type: object
      required: [stops, location_consent]
      properties:
        visit_type:
          type: string
          enum: [appointment, walk_in]
          default: appointment
          description: >
            walk_in creates an approved pass at once for offices accepting visitors; stop
            times are ignored and the chosen order is kept. appointment requires a slot per stop.
        stops:
          type: array
          minItems: 2
          maxItems: 3
          description: Different offices on the same day
          items: { $ref: "#/components/schemas/VisitStop" }
        device_name: { type: string, maxLength: 100 }
        location_consent:
          type: object
          required: [granted, version]
          properties:
            granted: { type: boolean, enum: [true] }
            version: { type: string, maxLength: 32 }
    VisitStatus:
      type: string
      description: >
        open = booked, not yet at the gate; checked_in = on campus; completed = checked out
        or past the last stop; closed = no stop can be attended (declined, cancelled, expired).
      enum: [open, checked_in, completed, closed]
    VisitSummary:
      type: object
      description: Present on an appointment that is a stop of a multi-stop visit; null otherwise. Such stops never carry their own qr_pass.
      nullable: true
      properties:
        id: { type: integer }
        visit_code: { type: string, example: MV-2026-000007 }
        visit_date: { type: string, example: "2026-10-02" }
        status: { $ref: "#/components/schemas/VisitStatus" }
        stop_number: { type: integer }
        stop_count: { type: integer }
    Visit:
      type: object
      properties:
        id: { type: integer }
        visit_code: { type: string }
        visit_date: { type: string }
        status: { $ref: "#/components/schemas/VisitStatus" }
        checked_in_at: { type: string, nullable: true }
        completed_at: { type: string, nullable: true }
        checkout_method:
          type: string
          nullable: true
          enum: [scan, guard, left_campus, end_of_day]
          description: How a finished visit ended. Appointments (appointment.php) carry the same field.
        tracking_appointment_id: { type: integer, nullable: true, description: Use this appointment id with tracking.php and consent.php once checked in }
        current_stop_id: { type: integer, nullable: true, description: The stop the visitor should head to now }
        qr_pass:
          type: object
          nullable: true
          description: Valid from 30 minutes before the first approved stop until the end of the last approved stop
        stops: { type: array, items: { type: object, additionalProperties: true } }
    DeviceRegistration:
      type: object
      required: [installation_id, fcm_token]
      properties:
        installation_id: { type: string, minLength: 8, maxLength: 191 }
        fcm_token: { type: string, minLength: 20, maxLength: 2048 }
        app_version: { type: string, maxLength: 32 }
        device_model: { type: string, maxLength: 100 }
    LocationPoint:
      type: object
      required: [client_event_id, latitude, longitude, captured_at]
      properties:
        client_event_id: { type: string, minLength: 8, maxLength: 64 }
        latitude: { type: number, minimum: -90, maximum: 90 }
        longitude: { type: number, minimum: -180, maximum: 180 }
        accuracy: { type: number, minimum: 0, maximum: 10000, nullable: true }
        captured_at: { type: string, example: "2026-09-21 09:15:00" }
