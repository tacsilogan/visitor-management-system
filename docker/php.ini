; PHP settings for the hosted server (Dockerfile). Errors go to the deploy logs, never to
; visitors' screens.
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED

date.timezone = Asia/Manila
memory_limit = 256M
max_execution_time = 60

; Staff profile photos are at most 2 MB. Saving directions inside a building sends up to
; 8 photos at once, which the browser has shrunk first.
upload_max_filesize = 4M
post_max_size = 8M

; Sign-in sessions on the persistent volume, so a redeploy signs nobody out.
; session_bootstrap.php keeps them in an isatu_vms_sessions folder inside it.
session.save_path = "/data/sessions"
session.use_strict_mode = 1
session.cookie_httponly = 1

opcache.enable = 1
opcache.memory_consumption = 64
opcache.max_accelerated_files = 4000
